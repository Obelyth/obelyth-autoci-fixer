name: CI Auto-Fix

# Reusable workflow. Repos call it from a thin caller file; see README.md.
#
# What it does: when a CI run fails, it checks out the failing branch, works out
# the real cause, fixes it, proves the suite passes inside the runner, then pushes
# one commit that explains what broke, why, and how it was fixed.
#
# What it will not do: weaken a test, skip a test, relax a CI gate, or force push.
# Those are blocked by scripts/honesty-guard.sh, which inspects the diff after
# Claude finishes and fails the job rather than letting a dishonest fix through.

on:
  workflow_call:
    inputs:
      max_attempts:
        description: "Consecutive auto-fix commits allowed on one branch before it is handed to a human."
        type: number
        default: 3
      protected_branches:
        description: "Comma-separated branches never pushed to directly. A fix for these opens a pull request instead."
        type: string
        default: "main,master"
      skip_branches:
        description: "Comma-separated glob patterns for branches to ignore entirely."
        type: string
        default: "context,save/red-*,gh-readonly-queue/*,claude/ci-autofix/*"
      skip_dependabot:
        description: "Ignore failures on dependabot branches."
        type: boolean
        default: true
      test_command:
        description: "Command that runs the full check suite. Empty means auto-detect from the repo."
        type: string
        default: ""
      setup_command:
        description: "Command that installs dependencies. Empty means auto-detect."
        type: string
        default: ""
      claude_args:
        description: "Extra arguments appended to the Claude CLI invocation."
        type: string
        default: ""
      autofix_repo:
        description: "Repository supplying the playbook and the honesty guard. Change it on a fork."
        type: string
        default: "Obelyth/obelyth-autoci-fixer"
      autofix_ref:
        description: "Ref of that repository to load."
        type: string
        default: "main"
      ci_wait_minutes:
        description: "How long to watch the re-run triggered by the fix push."
        type: number
        default: 25
      anthropic_federation_rule_id:
        description: >-
          Workload identity federation rule (fdrl_...). When set, the action
          exchanges this run's GitHub OIDC token for a short-lived Anthropic
          token and no static credential is passed at all. These three values
          are identifiers, not secrets.
        type: string
        default: ""
      anthropic_organization_id:
        description: "Anthropic organization UUID. Required with the federation rule."
        type: string
        default: ""
      anthropic_service_account_id:
        description: "Service account (svac_...) the federated token acts as."
        type: string
        default: ""
      anthropic_workspace_id:
        description: "Workspace (wrkspc_...). Only needed when the rule targets more than one."
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  triage:
    name: Decide whether to attempt a fix
    runs-on: ubuntu-latest
    # Cheap gate. Nothing below costs anything unless a same-repo CI run really failed.
    # Switched off 2026-09-17, too expensive: `false &&` skips all three jobs in every caller. Delete it to turn back on.
    if: >-
      false &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != ''
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      skip_reason: ${{ steps.decide.outputs.skip_reason }}
      attempt: ${{ steps.decide.outputs.attempt }}
      branch: ${{ steps.decide.outputs.branch }}
      protected: ${{ steps.decide.outputs.protected }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Check out the failing branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the auto-fix toolkit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          path: .ci-autofix
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          PROTECTED_BRANCHES: ${{ inputs.protected_branches }}
          SKIP_BRANCHES: ${{ inputs.skip_branches }}
          SKIP_DEPENDABOT: ${{ inputs.skip_dependabot }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          HAS_CLAUDE_CREDENTIAL: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || inputs.anthropic_federation_rule_id != '') && 'true' || 'false' }}
        run: bash .ci-autofix/scripts/triage.sh

      - name: Explain a skip
        if: steps.decide.outputs.proceed != 'true'
        run: |
          {
            echo "## CI Auto-Fix did not run"
            echo
            echo "${{ steps.decide.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  fix:
    name: Diagnose and fix (attempt ${{ needs.triage.outputs.attempt }})
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the failing branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.triage.outputs.branch }}
          fetch-depth: 0
          # Always the built-in token. CI_AUTOFIX_TOKEN is optional and therefore
          # allowed to be wrong; if checkout depended on it, a bad value would
          # kill the run before any diagnosis happened - which is exactly what it
          # did. It is used only for the push, where a bad value fails loudly and
          # costs nothing already done.
          token: ${{ github.token }}

      - name: Load the auto-fix toolkit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          path: .ci-autofix
          persist-credentials: false

      - name: Record the starting commit
        id: base
        run: |
          # The toolkit sits inside the working tree, so keep it out of git's
          # sight entirely rather than relying on nobody running `git add -A`.
          echo ".ci-autofix/" >> .git/info/exclude
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.email "claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"

      - name: Collect the failure evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: bash .ci-autofix/scripts/collect-evidence.sh

      - name: Take a fingerprint of the test suite
        env:
          OUT: ${{ runner.temp }}/fingerprint-before.json
        run: bash .ci-autofix/scripts/fingerprint.sh

      - name: Recall what earlier attempts tried
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: bash .ci-autofix/scripts/prior-attempts.sh

      - name: Diagnose and fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # A static credential takes precedence over federation inside the
          # action, so when a federation rule is configured these must be empty
          # or federation is silently ignored.
          claude_code_oauth_token: ${{ inputs.anthropic_federation_rule_id == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.anthropic_federation_rule_id == '' && secrets.ANTHROPIC_API_KEY || '' }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          github_token: ${{ github.token }}
          prompt: |
            You are fixing a failing CI run on ${{ github.repository }}.

            Failing branch: ${{ needs.triage.outputs.branch }}
            Failed run: ${{ github.event.workflow_run.html_url }}
            Attempt ${{ needs.triage.outputs.attempt }} of ${{ inputs.max_attempts }}.

            Read these files first. They are the whole job:
              .ci-autofix/PLAYBOOK.md          - how to do this honestly
              ${{ steps.evidence.outputs.path }} - the failing jobs and their logs
              ${{ steps.prior.outputs.path }} - what earlier attempts already tried
              (the last path is empty on the first attempt - skip it then)

            Suggested setup command: ${{ inputs.setup_command }}
            Suggested check command: ${{ inputs.test_command }}
            (Both may be empty. Work out the right ones from the repo's own CI
            workflow and package manifest if so.)

            Finish by making exactly one git commit. Do not push - the workflow
            pushes for you, after it has checked your work.
          claude_args: |
            --max-turns 80
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,NotebookEdit,TodoWrite,WebFetch,WebSearch,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(git stash:*),Bash(git rev-parse:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(go:*),Bash(cargo:*),Bash(make:*),Bash(swift:*),Bash(xcodebuild:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(jq:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr view:*),Bash(gh pr diff:*)'
            --disallowedTools 'Bash(git push:*),Bash(git reset:*),Bash(git rebase:*),Bash(git filter-branch:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(sudo:*),Bash(curl:*),Bash(rm -rf:*)'
            ${{ inputs.claude_args }}

      - name: Check the fix is honest
        id: guard
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          FINGERPRINT_BEFORE: ${{ runner.temp }}/fingerprint-before.json
        run: bash .ci-autofix/scripts/honesty-guard.sh

      - name: Prove the suite passes here
        id: verify
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash .ci-autofix/scripts/verify.sh

      - name: Write the commit message
        id: message
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          VERIFY_SUMMARY: ${{ steps.verify.outputs.summary }}
        run: bash .ci-autofix/scripts/write-commit-message.sh

      - name: Push the fix
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.CI_AUTOFIX_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PROTECTED: ${{ needs.triage.outputs.protected }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: bash .ci-autofix/scripts/push-fix.sh

      - name: Watch the re-run
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.pushed_branch }}
          SHA: ${{ steps.push.outputs.sha }}
          WAIT_MINUTES: ${{ inputs.ci_wait_minutes }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: bash .ci-autofix/scripts/watch-rerun.sh

  handoff:
    name: Hand back to a human
    needs: [triage, fix]
    if: always() && needs.triage.outputs.proceed == 'true' && needs.fix.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          persist-credentials: false
      - name: Explain what happened and stop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FIX_RESULT: ${{ needs.fix.result }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/handoff.sh
