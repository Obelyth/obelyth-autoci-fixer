name: CI Auto-Fix

# Reusable workflow. Repos call it from a thin caller file; see README.md.
#
# What it does: when a CI run fails, it works out what failed and whether this
# branch can be blamed for it - before any model runs. If it can, a fixer is
# let loose on exactly the files the diagnosis implicated and nothing else, a
# second model reads the result with no power to change it and tries to refute
# it, the suite is re-run here with the failing test required to have actually
# executed, and only then is one commit pushed - by default as a pull request.
#
# What it will not do: weaken a test, skip a test, relax a CI gate, edit a file
# the diagnosis did not implicate, grow past the size caps, or force push.
# Those are blocked by scripts/honesty-guard.sh, which inspects the diff after
# Claude finishes and fails the job rather than letting a dishonest fix through.

on:
  workflow_call:
    inputs:
      enabled:
        description: >-
          Master switch. Off by default since 2026-09-17, when the fixer was
          switched off for cost ("Switch off CI Auto-Fix and the install
          sweep: too expensive"). Every caller runs autofix.yml@main, so this
          default turns the whole fleet off at once; flip it to true here, or
          pass enabled: true from one caller, to turn it back on.
        type: boolean
        default: false
      max_attempts:
        description: "Consecutive auto-fix commits or fix pull requests allowed on one branch before it is handed to a human."
        type: number
        default: 3
      protected_branches:
        description: "Comma-separated branches never pushed to directly. A fix for these opens a pull request whatever push_mode says."
        type: string
        default: "main,master"
      skip_branches:
        description: "Comma-separated glob patterns for branches to ignore entirely."
        type: string
        default: "context,save/red-*,gh-readonly-queue/*,claude/ci-autofix/*"
      skip_dependabot:
        description: "Ignore failures on dependabot branches."
        type: boolean
        default: true
      push_mode:
        description: >-
          'pr' opens a pull request from a fix branch with the diagnosis and the
          second opinion in its body. 'direct' pushes onto the failing branch,
          and only when the second opinion approved and verification ran the
          failing test here. If the platform refuses to open the pull request
          the run hands off with the diff; it never falls back to a direct push.
        type: string
        default: "pr"
      max_changed_files:
        description: "A fix that changes more files than this is discarded."
        type: number
        default: 5
      max_changed_lines:
        description: "A fix that changes more lines (added plus removed) than this is discarded."
        type: number
        default: 150
      fixer_model:
        description: "Model that diagnoses and edits."
        type: string
        default: "claude-opus-5"
      reviewer_model:
        description: >-
          Model that gives the second opinion. Deliberately a different model
          from the fixer: a reviewer that shares the fixer's weights tends to
          find the fixer's reasoning persuasive, and the point of a second
          opinion is independent error. Sonnet 5 is also a fraction of the
          price for a read-only pass.
        type: string
        default: "claude-sonnet-5"
      test_command:
        description: "Command that runs the full check suite. Empty means auto-detect from the repo."
        type: string
        default: ""
      setup_command:
        description: "Command that installs dependencies. Empty means auto-detect."
        type: string
        default: ""
      claude_args:
        description: "Extra arguments appended to the fixer's Claude CLI invocation."
        type: string
        default: ""
      autofix_repo:
        description: "Repository supplying the playbook and the honesty guard. Change it on a fork."
        type: string
        default: "Obelyth/obelyth-autoci-fixer"
      autofix_ref:
        description: "Ref of that repository to load."
        type: string
        default: "main"
      ci_wait_minutes:
        description: "How long to watch the re-run triggered by the fix push."
        type: number
        default: 25
      anthropic_federation_rule_id:
        description: >-
          Workload identity federation rule (fdrl_...). When set, the action
          exchanges this run's GitHub OIDC token for a short-lived Anthropic
          token and no static credential is passed at all. These three values
          are identifiers, not secrets.
        type: string
        default: ""
      anthropic_organization_id:
        description: "Anthropic organization UUID. Required with the federation rule."
        type: string
        default: ""
      anthropic_service_account_id:
        description: "Service account (svac_...) the federated token acts as."
        type: string
        default: ""
      anthropic_workspace_id:
        description: "Workspace (wrkspc_...). Only needed when the rule targets more than one."
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  triage:
    name: Decide whether to attempt a fix
    runs-on: ubuntu-latest
    # Cheap gate. Nothing below costs anything unless a same-repo CI run really
    # failed - and since the diagnosis lives here too, nothing costs a model
    # turn unless the failure can be linked to this branch.
    if: >-
      inputs.enabled &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != ''
    outputs:
      proceed: ${{ steps.decide.outputs.proceed == 'true' && steps.diagnose.outputs.stop != 'true' && 'true' || 'false' }}
      skip_reason: ${{ steps.diagnose.outputs.stop == 'true' && steps.diagnose.outputs.reason || steps.decide.outputs.skip_reason }}
      attempt: ${{ steps.decide.outputs.attempt }}
      branch: ${{ steps.decide.outputs.branch }}
      protected: ${{ steps.decide.outputs.protected }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
      diagnosis: ${{ steps.diagnose.outputs.json }}
      diag_class: ${{ steps.diagnose.outputs.class }}
      diag_reason: ${{ steps.diagnose.outputs.reason }}
      allowed_paths: ${{ steps.diagnose.outputs.allowed_paths }}
      failing_tests: ${{ steps.diagnose.outputs.failing_tests }}
    steps:
      - name: Check out the failing branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the auto-fix toolkit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          path: .ci-autofix
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          PROTECTED_BRANCHES: ${{ inputs.protected_branches }}
          SKIP_BRANCHES: ${{ inputs.skip_branches }}
          SKIP_DEPENDABOT: ${{ inputs.skip_dependabot }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          HAS_CLAUDE_CREDENTIAL: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || inputs.anthropic_federation_rule_id != '') && 'true' || 'false' }}
        run: bash .ci-autofix/scripts/triage.sh

      - name: Collect the failure evidence
        id: evidence
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: bash .ci-autofix/scripts/collect-evidence.sh

      # The diagnosis: which jobs and steps failed, which test files the log
      # names, what this branch changed, and whether the two meet. It decides
      # the class (code / test / env-data / unlinked) and the list of files the
      # fixer may touch. env-data and unlinked stop right here, with a comment
      # and no model run - which is what would have stopped the run that
      # rewrote three test files for a failure caused by data in a private
      # checkout it could not even read.
      - name: Diagnose
        id: diagnose
        if: steps.decide.outputs.proceed == 'true'
        env:
          RUN_JSON: ${{ steps.evidence.outputs.run_json }}
          RAW_LOG: ${{ steps.evidence.outputs.raw_log }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ steps.decide.outputs.base_ref }}
          DIAGNOSIS_OUT: ${{ runner.temp }}/diagnosis.json
        run: bash .ci-autofix/scripts/diagnose.sh

      - name: Stop - this failure is not this branch's to fix
        if: steps.decide.outputs.proceed == 'true' && steps.diagnose.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.decide.outputs.branch }}
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
          ATTEMPT: ${{ steps.decide.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FIX_RESULT: ${{ steps.diagnose.outputs.class }}
          DIAG_CLASS: ${{ steps.diagnose.outputs.class }}
          DIAG_REASON: ${{ steps.diagnose.outputs.reason }}
          FAILING_TESTS: ${{ steps.diagnose.outputs.failing_tests }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .ci-autofix/scripts/handoff.sh

      - name: Keep the diagnosis for the record
        if: steps.decide.outputs.proceed == 'true' && steps.diagnose.outputs.stop == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-autofix-audit
          path: |
            ${{ runner.temp }}/ci-failure.md
            ${{ runner.temp }}/diagnosis.json
          if-no-files-found: ignore

      - name: Explain a skip
        if: steps.decide.outputs.proceed != 'true' || steps.diagnose.outputs.stop == 'true'
        env:
          REASON: ${{ steps.diagnose.outputs.stop == 'true' && steps.diagnose.outputs.reason || steps.decide.outputs.skip_reason }}
        run: |
          {
            echo "## CI Auto-Fix did not run"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  fix:
    name: Diagnose and fix (attempt ${{ needs.triage.outputs.attempt }})
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      verdict: ${{ steps.opinion.outputs.verdict }}
      verdict_reason: ${{ steps.opinion.outputs.reason }}
      could_not_run: ${{ steps.verify.outputs.could_not_run }}
      audit_url: ${{ steps.audit.outputs.artifact-url }}
      handoff_posted: ${{ steps.push.outputs.handoff_posted }}
    steps:
      - name: Check out the failing branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.triage.outputs.branch }}
          fetch-depth: 0
          # Always the built-in token. CI_AUTOFIX_TOKEN is optional and therefore
          # allowed to be wrong; if checkout depended on it, a bad value would
          # kill the run before any diagnosis happened - which is exactly what it
          # did. It is used only for the push, where a bad value fails loudly and
          # costs nothing already done.
          token: ${{ github.token }}

      - name: Load the auto-fix toolkit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          path: .ci-autofix
          persist-credentials: false

      - name: Record the starting commit
        id: base
        run: |
          # The toolkit sits inside the working tree, so keep it out of git's
          # sight entirely rather than relying on nobody running `git add -A`.
          echo ".ci-autofix/" >> .git/info/exclude
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "audit=$RUNNER_TEMP/audit" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/audit"
          git config user.email "claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"

      - name: Collect the failure evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: bash .ci-autofix/scripts/collect-evidence.sh

      # The diagnosis made in triage, restored where the fixer, the guard and
      # verification all read it, and turned into the deny list the fixer runs
      # under: tests, workflows, manifests and lockfiles are off limits except
      # the paths the diagnosis implicated.
      - name: Restore the diagnosis and draw the box
        id: scope
        env:
          DIAGNOSIS_JSON: ${{ needs.triage.outputs.diagnosis }}
          DIAGNOSIS: .ci-autofix/diagnosis.json
          SETTINGS_OUT: ${{ runner.temp }}/claude-settings.json
        run: |
          printf '%s\n' "$DIAGNOSIS_JSON" | jq . > .ci-autofix/diagnosis.json
          cp .ci-autofix/diagnosis.json "$RUNNER_TEMP/audit/diagnosis.json"
          cp "${{ steps.evidence.outputs.path }}" "$RUNNER_TEMP/audit/ci-failure.md"
          bash .ci-autofix/scripts/scope-settings.sh
          cp "$SETTINGS_OUT" "$RUNNER_TEMP/audit/claude-settings.json"

      - name: Take a fingerprint of the test suite
        env:
          OUT: ${{ runner.temp }}/fingerprint-before.json
        run: bash .ci-autofix/scripts/fingerprint.sh

      - name: Recall what earlier attempts tried
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: bash .ci-autofix/scripts/prior-attempts.sh

      # The fixer can run python, node and make, and the deny list governs
      # only its file tools - so everything on this disk is writable to it,
      # the toolkit and the diagnosis included, and .ci-autofix/ is excluded
      # from git's sight so a rewrite there never shows in the diff. What the
      # fixer cannot touch is a step output the runner has already recorded.
      # So the toolkit's content is hashed here, checked again after the fixer,
      # and the diagnosis every later step judges by is re-materialised from
      # the triage job's output rather than read back from the workspace.
      - name: Seal the toolkit
        id: seal
        run: |
          echo "toolkit=$(cd .ci-autofix && find . -path ./.git -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Diagnose and fix
        id: claude
        uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        with:
          # A static credential takes precedence over federation inside the
          # action, so when a federation rule is configured these must be empty
          # or federation is silently ignored.
          claude_code_oauth_token: ${{ inputs.anthropic_federation_rule_id == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.anthropic_federation_rule_id == '' && secrets.ANTHROPIC_API_KEY || '' }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          github_token: ${{ github.token }}
          # The deny list drawn from the diagnosis. Only Edit(path) rules count
          # for file permissions in Claude Code, and they cover Write,
          # MultiEdit, NotebookEdit, sed -i, tee and redirects too.
          settings: ${{ steps.scope.outputs.path }}
          prompt: |
            You are fixing a failing CI run on ${{ github.repository }}.

            Failing branch: ${{ needs.triage.outputs.branch }}
            Failed run: ${{ github.event.workflow_run.html_url }}
            Attempt ${{ needs.triage.outputs.attempt }} of ${{ inputs.max_attempts }}.

            The failure has already been diagnosed. This is your box:
              Class:          ${{ needs.triage.outputs.diag_class }}
              Why:            ${{ needs.triage.outputs.diag_reason }}
              Failing tests:  ${{ needs.triage.outputs.failing_tests }}
              You may change: ${{ needs.triage.outputs.allowed_paths }}
            Every other file is off limits - tests, workflows, manifests and
            lockfiles are denied to your editing tools, and the workflow checks
            the diff afterwards: a change to any file not in that list, more
            than ${{ inputs.max_changed_files }} files, or more than
            ${{ inputs.max_changed_lines }} changed lines, is discarded whole.
            If the honest fix does not fit in the box, make no commit and say
            why. That is a good outcome.

            Read these files first. They are the whole job:
              .ci-autofix/PLAYBOOK.md          - how to do this honestly
              .ci-autofix/diagnosis.json       - the diagnosis, in full
              ${{ steps.evidence.outputs.path }} - the failing jobs and their logs
              ${{ steps.prior.outputs.path }} - what earlier attempts already tried
              (the last path is empty on the first attempt - skip it then)

            Suggested setup command: ${{ inputs.setup_command }}
            Suggested check command: ${{ inputs.test_command }}
            (Both may be empty. Work out the right ones from the repo's own CI
            workflow and package manifest if so.)

            Finish by making exactly one git commit. Do not push - the workflow
            pushes for you, after a second model has tried to refute your fix
            and the suite has passed here with the failing test actually run.
          claude_args: |
            --model ${{ inputs.fixer_model }}
            --max-turns 80
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,NotebookEdit,TodoWrite,WebFetch,WebSearch,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(git stash:*),Bash(git rev-parse:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(go:*),Bash(cargo:*),Bash(make:*),Bash(swift:*),Bash(xcodebuild:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(jq:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr view:*),Bash(gh pr diff:*)'
            --disallowedTools 'Bash(git push:*),Bash(git reset:*),Bash(git rebase:*),Bash(git filter-branch:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(sudo:*),Bash(curl:*),Bash(rm -rf:*)'
            ${{ inputs.claude_args }}

      # Both claude-code-action steps write the same execution file, so the
      # fixer's transcript is copied aside before the reviewer overwrites it.
      - name: Keep the fixer's transcript
        if: always() && steps.claude.outputs.execution_file != ''
        run: cp "${{ steps.claude.outputs.execution_file }}" "$RUNNER_TEMP/audit/claude-execution-output.json"

      # Nothing below trusts what the fixer left in the workspace. The toolkit
      # has to hash to what it hashed to before the fixer ran, and the
      # diagnosis the guard, the reviewer, verification, the commit message
      # and the push all read is written fresh from the triage job's output.
      - name: Check the toolkit is untouched and reload the diagnosis
        id: reload
        env:
          SEALED: ${{ steps.seal.outputs.toolkit }}
          DIAGNOSIS_JSON: ${{ needs.triage.outputs.diagnosis }}
        run: |
          now="$(cd .ci-autofix && find . -path ./.git -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [[ "$now" != "$SEALED" ]]; then
            echo "::error::The auto-fix toolkit was modified while the fixer ran. The rules that judge a fix are not the fixer's to change; nothing is pushed."
            {
              echo "## Blocked"
              echo
              echo "The toolkit under \`.ci-autofix/\` no longer matches what was sealed before the fixer ran. Nothing was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/guard"
          printf '%s\n' "$DIAGNOSIS_JSON" | jq . > "$RUNNER_TEMP/guard/diagnosis.json"
          echo "diagnosis=$RUNNER_TEMP/guard/diagnosis.json" >> "$GITHUB_OUTPUT"

      - name: Check the fix is honest and inside the box
        id: guard
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          FINGERPRINT_BEFORE: ${{ runner.temp }}/fingerprint-before.json
          DIAGNOSIS: ${{ steps.reload.outputs.diagnosis }}
          MAX_CHANGED_FILES: ${{ inputs.max_changed_files }}
          MAX_CHANGED_LINES: ${{ inputs.max_changed_lines }}
        run: bash .ci-autofix/scripts/honesty-guard.sh

      # The diff and the log are rendered here because the reviewer has no
      # shell: a `git diff` it could run takes --output, and a reviewer that
      # can write a file is not read-only.
      - name: Save the diff for review
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git diff "${BASE_SHA}..HEAD" > "$RUNNER_TEMP/audit/fix.diff"
          git log --stat --format='commit %H%nAuthor: %an <%ae>%nDate:   %ad%n%n%B' "${BASE_SHA}..HEAD" > "$RUNNER_TEMP/audit/fix.log"

      # A fresh session, a different model, and no way to change anything: its
      # only job is to find the reason this fix is wrong. It reads the
      # diagnosis, the whole diff, the playbook and the failing log, and ends
      # with one line - VERDICT: APPROVE, or VERDICT: REJECT and one sentence.
      - name: Second opinion
        id: reviewer
        uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        with:
          claude_code_oauth_token: ${{ inputs.anthropic_federation_rule_id == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.anthropic_federation_rule_id == '' && secrets.ANTHROPIC_API_KEY || '' }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          github_token: ${{ github.token }}
          prompt: |
            You are the second opinion on an automated CI fix for
            ${{ github.repository }}. Another model wrote it; you did not, and
            you cannot change it. Your job is to REFUTE it: find the reason it
            is wrong, dishonest, out of scope, or aimed at the wrong cause.
            Approve only if you genuinely cannot.

            Read, in this order:
              ${{ steps.reload.outputs.diagnosis }} - what failed, what this branch changed, the allowed paths
              ${{ steps.base.outputs.audit }}/fix.diff - the whole change, ${{ steps.base.outputs.sha }}..HEAD
              ${{ steps.base.outputs.audit }}/fix.log  - the commit(s) in that range, with the files each touched
              .ci-autofix/PLAYBOOK.md           - the rules the fix had to follow
              ${{ steps.evidence.outputs.path }}  - the failing jobs and their logs
            You have no shell: you can read any file in the repository, but you
            cannot run commands. The diff and the log above are rendered for you.

            Check, and say what you found for each:
              1. Scope: does the diff touch only allowed_paths? Only the failing
                 test may be edited, and only if this branch's own diff changed
                 the behaviour it encodes.
              2. Cause: does the change fix the cause named in the diagnosis, or
                 a symptom? Would the failing test now pass for the right reason?
              3. Honesty: is any assertion loosened, test removed or skipped, or
                 gate relaxed - however it is dressed up?
              4. Environment: could the failure be caused by data, a checkout or
                 a secret this runner does not have, so that no code change here
                 is the fix?
              5. The commit message: is the stated cause supported by the log?

            Be terse. End your reply with exactly one final line, nothing after it:
              VERDICT: APPROVE
            or
              VERDICT: REJECT - <one sentence saying why>
          claude_args: |
            --model ${{ inputs.reviewer_model }}
            --max-turns 30
            --allowedTools 'Read,Glob,Grep'
            --disallowedTools 'Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch'

      - name: Parse the verdict
        id: opinion
        if: always() && steps.guard.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
          VERDICT_OUT: ${{ runner.temp }}/audit/verdict.txt
          REVIEWER_MODEL: ${{ inputs.reviewer_model }}
        run: |
          [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]] && cp "$EXECUTION_FILE" "$RUNNER_TEMP/audit/reviewer-execution-output.json"
          bash .ci-autofix/scripts/second-opinion.sh

      - name: Prove the suite passes here, failing test included
        id: verify
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DIAGNOSIS: ${{ steps.reload.outputs.diagnosis }}
          VERIFY_LOG: ${{ runner.temp }}/audit/verify-output.log
        run: bash .ci-autofix/scripts/verify.sh

      - name: Write the commit message
        id: message
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          VERIFY_SUMMARY: ${{ steps.verify.outputs.summary }}
          DIAGNOSIS: ${{ steps.reload.outputs.diagnosis }}
          VERDICT: ${{ steps.opinion.outputs.verdict }}
          REVIEWER_MODEL: ${{ inputs.reviewer_model }}
        run: |
          bash .ci-autofix/scripts/write-commit-message.sh
          git diff "${BASE_SHA}..HEAD" > "$RUNNER_TEMP/audit/fix.diff"
          git log -1 --format=%B > "$RUNNER_TEMP/audit/commit-message.txt"

      # Everything a person needs to audit the run, whether or not it pushed:
      # both transcripts, the evidence, the diagnosis, the deny list, the
      # verdict, verification output and the diff.
      - name: Upload the audit trail
        id: audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-autofix-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: ignore

      - name: Push the fix
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.CI_AUTOFIX_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PROTECTED: ${{ needs.triage.outputs.protected }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          PUSH_MODE: ${{ inputs.push_mode }}
          VERDICT: ${{ steps.opinion.outputs.verdict }}
          VERDICT_REASON: ${{ steps.opinion.outputs.reason }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          DIAGNOSIS: ${{ steps.reload.outputs.diagnosis }}
          AUDIT_URL: ${{ steps.audit.outputs.artifact-url }}
          AUDIT_DIR: ${{ runner.temp }}/audit
          GH_REPO: ${{ github.repository }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .ci-autofix/scripts/push-fix.sh

      - name: Watch the re-run
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.pushed_branch }}
          SHA: ${{ steps.push.outputs.sha }}
          WAIT_MINUTES: ${{ inputs.ci_wait_minutes }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: bash .ci-autofix/scripts/watch-rerun.sh

  handoff:
    name: Hand back to a human
    needs: [triage, fix]
    if: >-
      always() && needs.triage.outputs.proceed == 'true' &&
      needs.fix.result != 'success' && needs.fix.outputs.handoff_posted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.autofix_repo }}
          ref: ${{ inputs.autofix_ref }}
          persist-credentials: false
      - name: Explain what happened and stop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          FIX_RESULT: ${{ needs.fix.outputs.verdict == 'REJECT' && 'rejected' || needs.fix.result }}
          DIAG_CLASS: ${{ needs.triage.outputs.diag_class }}
          DIAG_REASON: ${{ needs.triage.outputs.diag_reason }}
          FAILING_TESTS: ${{ needs.triage.outputs.failing_tests }}
          ALLOWED_PATHS: ${{ needs.triage.outputs.allowed_paths }}
          VERDICT: ${{ needs.fix.outputs.verdict }}
          VERDICT_REASON: ${{ needs.fix.outputs.verdict_reason }}
          COULD_NOT_RUN: ${{ needs.fix.outputs.could_not_run }}
          AUDIT_URL: ${{ needs.fix.outputs.audit_url }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/handoff.sh
