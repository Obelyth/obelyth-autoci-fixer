# CI Auto-Fix
#
# Installed by __TOOLKIT_REPO__. Do not edit this file by hand - it is
# regenerated by that repo's installer, which also keeps the watched workflow
# list below in step with the workflows this repo actually has.
#
# What it does: when one of the workflows below fails, it diagnoses the failure
# first and stops if this branch is not the cause. Otherwise it fixes only the
# files the diagnosis implicated, has a second model try to refute the fix,
# proves the suite passes with the failing test actually run, and opens a pull
# request with the diagnosis and the verdict in its body. It will not weaken a
# test or a CI gate to get there, and it never force pushes.
#
# Full description: https://github.com/__TOOLKIT_REPO__
name: CI Auto-Fix

on:
  workflow_run:
    workflows: __WORKFLOWS__
    types: [completed]

# One branch, one fixer at a time. A push that fails several watched workflows
# emits one workflow_run event each, and without this they all start at once,
# every one of them reading the attempt count before any of the others has
# recorded itself - so the retry cap is bypassed and the same failure is
# diagnosed several times in parallel. Queueing rather than cancelling means the
# second run starts after the first has finished and sees the real count.
concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  autofix:
    uses: __TOOLKIT_REPO__/.github/workflows/autofix.yml@main
    secrets: inherit
    with:
      max_attempts: 3
      protected_branches: __PROTECTED__
      # A fix arrives as a pull request from a fix branch. 'direct' pushes onto
      # the failing branch instead, and only when the second opinion approved
      # and verification ran the failing test in the runner.
      push_mode: pr
      # A fix wider than this is discarded and handed to a person.
      max_changed_files: 5
      max_changed_lines: 150
      # Workload identity federation. These are identifiers, not secrets - the
      # run's GitHub OIDC token is exchanged for a short-lived Anthropic token,
      # so there is no API key stored anywhere. Empty means fall back to the
      # CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secrets instead.
      anthropic_federation_rule_id: "__FED_RULE__"
      anthropic_organization_id: "__FED_ORG__"
      anthropic_service_account_id: "__FED_SVC__"
      anthropic_workspace_id: "__FED_WS__"
